      - BearerAuth: []
      summary: Pool UUID from name
      tags:
      - pools
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    description: 'JWT from /storage-pool/authenticate. Prefer value: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
