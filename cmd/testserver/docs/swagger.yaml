  /storage-pool/uuid-by-name:
    get:
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool name
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
