      tags:
      - meta
  /storage-pool/get-uid:
    get:
      parameters:
      - description: Libvirt URI (allowlist check)
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Process UID of the testserver
      tags:
      - meta
  /storage-pool/info:
    get:
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool name or UUID
        in: query
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Get pool info
      tags:
      - pools
  /storage-pool/list:
    get:
      parameters:
      - description: Libvirt URI (must be allowlisted)
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: List flags
        in: query
        name: option
        type: integer
      - description: XML flags for inactive pools
        in: query
        name: inactive
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: List storage pools
      tags:
      - pools
  /storage-pool/name:
    get:
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool name or UUID
        in: query
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Pool name from ref
      tags:
      - pools
  /storage-pool/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool UUID (or JSON body)
        in: query
        name: uuid
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Refresh pool volumes
      tags:
      - pools
  /storage-pool/start:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool name or UUID and flags
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UuidOptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Start a pool
      tags:
      - pools
  /storage-pool/undefine:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool UUID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UuidOptionRequest'
      produces:
