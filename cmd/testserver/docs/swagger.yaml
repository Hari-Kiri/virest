basePath: /
definitions:
  handlers.AutostartRequest:
    properties:
      autostart:
        example: true
        type: boolean
      uuid:
        example: 00000000-0000-0000-0000-000000000000
        type: string
    type: object
  handlers.CreateAsRequest:
    type: object
  handlers.DefineAsRequest:
    type: object
  handlers.DefineRequest:
    properties:
      option:
        example: 0
        type: integer
      storagePool: {}
    type: object
  handlers.Envelope:
    properties:
      code:
        type: integer
      data: {}
      error:
        type: string
      response:
        type: boolean
    type: object
  handlers.FindSourcesAsRequest:
    type: object
  handlers.FindSourcesRequest:
    properties:
      srcSpec: {}
      type:
        example: netfs
        type: string
    type: object
  handlers.TokenEnvelope:
    properties:
      code:
        type: integer
      data:
        properties:
          token:
            type: string
        type: object
      error:
        type: string
      response:
        type: boolean
    type: object
  handlers.UuidOptionRequest:
    properties:
      option:
        example: 0
        type: integer
      uuid:
        example: 00000000-0000-0000-0000-000000000000
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: Optional HTTP harness for the storagepool Go library. Authenticate
    with Basic Auth to get a JWT, then call pool APIs with Bearer token and Hypervisor-Uri
    header. Use Authorize in Swagger UI to set credentials (Postman-like try-it-out).
  title: ViRest Storage Pool Testserver
  version: "1.0"
paths:
  /storage-pool/authenticate:
    get:
      description: Authenticate with HTTP Basic and receive a Bearer JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TokenEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BasicAuth: []
      summary: Issue JWT
      tags:
      - auth
  /storage-pool/autostart:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Autostart settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AutostartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Set pool autostart
      tags:
      - pools
  /storage-pool/build:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool name or UUID and build flags
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UuidOptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Build pool storage
      tags:
      - pools
  /storage-pool/capabilities:
    get:
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Get storage pool capabilities
      tags:
      - pools
  /storage-pool/create:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool name or UUID and create flags
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UuidOptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Create (start) a pool
      tags:
      - pools
  /storage-pool/create-as:
    post:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Create-as params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Create transient pool from args
      tags:
      - pools
  /storage-pool/create-transient:
    post:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool model and flags
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.DefineRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Create transient pool
      tags:
      - pools
  /storage-pool/define:
    post:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.DefineRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Define a storage pool
      tags:
      - pools
  /storage-pool/define-as:
    post:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Define-as params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.DefineAsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Define pool from args
      tags:
      - pools
  /storage-pool/delete:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool UUID and delete flags
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UuidOptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Delete pool resources
      tags:
      - pools
  /storage-pool/destroy:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool UUID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UuidOptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Destroy (stop) a pool
      tags:
      - pools
  /storage-pool/detail:
    get:
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool name or UUID
        in: query
        name: uuid
        required: true
        type: string
      - description: XML flags
        in: query
        name: option
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Get pool detail
      tags:
      - pools
  /storage-pool/dump:
    get:
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool name or UUID
        in: query
        name: uuid
        required: true
        type: string
      - description: XML flags
        in: query
        name: option
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Dump pool description
      tags:
      - pools
  /storage-pool/event:
    get:
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Pool UUID
        in: query
        name: uuid
        required: true
        type: string
      - description: 0=lifecycle, 1=refresh
        in: query
        name: types
        type: integer
      - description: Set to 1 for SSE
        in: query
        name: stream
        type: string
      - description: SSE timeout seconds
        in: query
        name: timeout
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Envelope'
      security:
      - BearerAuth: []
      summary: Wait for pool event (or SSE stream)
      tags:
      - events
  /storage-pool/find-sources-as:
    post:
      consumes:
      - application/json
      parameters:
      - description: Libvirt URI
        in: header
        name: Hypervisor-Uri
        required: true
        type: string
      - description: Find-sources-as params
        in: body
        name: body
